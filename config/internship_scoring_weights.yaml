  single_rest: {keywords: [单休, 每周工作6天, 每周六天], penalty: 5}
  unpaid_overtime: {keywords: [长期无偿加班], penalty: 5}
  no_agreement: {keywords: [不签实习协议, 没有实习协议], penalty: 3}
  no_certificate: {keywords: [不提供实习证明], penalty: 2}
conversion_questions:
  - 该岗位是否有正式转正或校招优先通道？
  - 团队过去是否有实习生留用案例？
  - 转正岗位是否已有正式HC？
internship_questions:
  - 实习生会参与哪些真实项目？
  - 是否能够独立负责某个模块或交付成果？
  - 是否有固定导师？
  - 实习周期和每周到岗天数是多少？
  - 日常上下班和加班情况如何？
  - 是否提供实习协议和实习证明？
  - 实习结束后成果是否可以写入简历或作品集？

