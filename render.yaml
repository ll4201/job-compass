services:
  - type: web
    name: job-compass-demo
    runtime: python
    plan: free
    buildCommand: python scripts/build_static_bundle.py && pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: AI_ANALYZER_ENABLED
        value: "false"
