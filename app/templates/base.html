<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Job Compass{% endblock %}</title><link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/favicon.svg') }}?v={{ static_version }}"><link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v={{ static_version }}"></head><body>
<header><a class="brand" href="/">JOB COMPASS <span>PUBLIC PORTFOLIO</span></a><nav><a href="/application-outcomes">投递统计</a><a href="/sources">数据源</a><a href="/collection-runs">采集记录</a><a href="/candidate-companies">候选企业</a><a href="/calibration">评分校准</a><a href="/docs">API</a><a href="/export.csv">导出 Demo 数据</a></nav></header>
